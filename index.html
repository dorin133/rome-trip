const ITER = 600000;

const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const err = document.getElementById("err");
const go = document.getElementById("go");

document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  if (!pw) return;
  go.disabled = true;
  go.textContent = "Unlocking\u2026";
  err.textContent = "";
  try {
    const baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
    const html = new TextDecoder().decode(plain);
    // Render into a fresh iframe document rather than document.write, so the
    // decrypted page gets a normal load lifecycle (it has a window 'load'
    // handler) instead of depending on document.open() readiness semantics.
    const frame = document.createElement("iframe");
    frame.setAttribute("title", "Rome day plan");
    frame.srcdoc = html;
    document.body.replaceChildren(frame);
  } catch {
    err.textContent = "Wrong password.";
    go.disabled = false;
    go.textContent = "Open";
  }
});
</script>
